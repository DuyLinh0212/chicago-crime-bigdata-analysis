name: HDFS - Chuẩn hóa - Phân tích
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chicago-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pipeline:
    name: Mốc 2 - HDFS, Parquet và bốn phân tích
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: chicago-${{ github.run_id }}-${{ github.run_attempt }}
      CHICAGO_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Lấy code và sáu CSV
        uses: actions/checkout@v4
      - name: Cài Python cho runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Chuẩn bị thư mục bằng chứng
        run: mkdir -p artifacts/{logs,manifests,screenshots,silver}
      - name: Cài trình duyệt chụp bằng chứng
        timeout-minutes: 4
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check --retries 2 --timeout 30 playwright==1.56.0
          google-chrome --version
      - name: Tạo HDFS với ba DataNode trên GitHub
        run: |
          set -o pipefail
          docker compose -f ci/compose.yaml build spark-job 2>&1 | tee artifacts/logs/00-build.log
          docker compose -f ci/compose.yaml up -d --wait --wait-timeout 240 namenode datanode1 datanode2 datanode3 2>&1 | tee artifacts/logs/01-start.log
          python -m pipeline.stages prepare 2>&1 | tee artifacts/logs/02-hdfs.log
      - name: Kiểm tra chuẩn hóa bằng dữ liệu mẫu trên GitHub
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_wsl_runtime.py -v 2>&1 | tee artifacts/logs/03-bridge-checks.log
          python -m pipeline.stages checks 2>&1 | tee artifacts/logs/04-normalize-checks.log
      - name: Đẩy toàn bộ dữ liệu lên Bronze và đối chiếu checksum
        run: |
          set -o pipefail
          python -m pipeline.stages upload 2>&1 | tee artifacts/logs/05-bronze.log
      - name: Chuẩn hóa Parquet Snappy và kiểm tra chạy lại
        run: |
          set -o pipefail
          python -m pipeline.stages normalize 2>&1 | tee artifacts/logs/06-normalize.log
      - name: Kiểm tra Silver và hai bản sao block thực tế
        run: |
          set -o pipefail
          python -m pipeline.stages verify 2>&1 | tee artifacts/logs/07-verify.log
          python -m pipeline.stages export 2>&1 | tee artifacts/logs/08-export.log
      - name: Phân tích thời gian - năm, tháng, ngày, giờ
        run: |
          set -o pipefail
          python -m pipeline.stages temporal 2>&1 | tee artifacts/logs/09-thoi-gian.log
      - name: Phân tích loại tội phạm và tỷ trọng
        run: |
          set -o pipefail
          python -m pipeline.stages crime-types 2>&1 | tee artifacts/logs/10-loai-toi-pham.log
      - name: Phân tích khu dân cư và loại địa điểm
        run: |
          set -o pipefail
          python -m pipeline.stages spatial 2>&1 | tee artifacts/logs/11-khong-gian.log
      - name: Phân tích đa chiều và so sánh xu hướng
        run: |
          set -o pipefail
          python -m pipeline.stages cross 2>&1 | tee artifacts/logs/12-phan-tich-cheo.log
      - name: Kiểm chứng ảnh, số liệu và xuất báo cáo HTML
        run: |
          set -o pipefail
          python -m pipeline.stages report 2>&1 | tee artifacts/logs/13-bao-cao.log
      - name: Thu thập log hệ thống kể cả khi lỗi
        if: always()
        run: |
          docker compose -f ci/compose.yaml ps -a > artifacts/logs/containers.log 2>&1 || true
          docker compose -f ci/compose.yaml logs --no-color --tail 200 > artifacts/logs/docker.log 2>&1 || true
      - name: Chụp ảnh HDFS và ảnh hiển thị log thực tế
        if: always()
        run: python screenshots/capture_evidence.py
      - name: Ghi ảnh báo cáo lên Gold
        if: success()
        run: |
          set -o pipefail
          python -m pipeline.stages publish-report 2>&1 | tee artifacts/logs/14-gold.log
      - name: Xuất artifact bằng chứng, log và manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bang-chung-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/logs
            artifacts/manifests
            artifacts/screenshots
          retention-days: 14
          if-no-files-found: error
      - name: Xuất artifact Parquet Silver
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: silver-parquet-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/silver
          retention-days: 14
          if-no-files-found: error
      - name: Xuất artifact biểu đồ, bảng số liệu và báo cáo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phan-tich-bao-cao-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/analystics
            artifacts/report
          retention-days: 14
          if-no-files-found: warn
      - name: Ghi tóm tắt và dọn môi trường runner
        if: always()
        run: |
          echo '## Kết quả pipeline Chicago Crimes' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA — Lần chạy: $CHICAGO_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo 'Tải ảnh, log và manifest tại mục Artifacts bên dưới workflow. HDFS chỉ tồn tại trong lần chạy này.' >> "$GITHUB_STEP_SUMMARY"
          docker compose -f ci/compose.yaml down -v --remove-orphans || true
