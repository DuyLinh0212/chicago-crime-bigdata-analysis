x-hadoop-env: &hadoop-env
  CORE_CONF_fs_defaultFS: hdfs://namenode:9000
  HDFS_CONF_dfs_replication: "2"
  HDFS_CONF_dfs_blocksize: "134217728"
  HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
  HADOOP_HEAPSIZE: "512"

x-datanode: &datanode
  image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
  environment:
    <<: *hadoop-env
    SERVICE_PRECONDITION: namenode:9870
  depends_on:
    namenode:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:9864/"]
    interval: 5s
    timeout: 5s
    retries: 36
    start_period: 15s
  mem_limit: 1g

services:
  kafka:
    image: apache/kafka:3.9.2
    profiles: ["kafka"]
    hostname: kafka
    ports: ["127.0.0.1:19092:19092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 20s
    mem_limit: 1g
  postgres:
    image: postgres:16-alpine
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_ci
      POSTGRES_DB: airflow
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 512m
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      <<: *hadoop-env
      CLUSTER_NAME: chicago-ci
    ports: ["127.0.0.1:9870:9870"]
    volumes:
      - namenode:/hadoop/dfs/name
      - ../artifacts:/artifacts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9870/"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 15s
    mem_limit: 1g
  datanode1:
    <<: *datanode
    volumes: ["datanode1:/hadoop/dfs/data"]
  datanode2:
    <<: *datanode
    volumes: ["datanode2:/hadoop/dfs/data"]
  datanode3:
    <<: *datanode
    volumes: ["datanode3:/hadoop/dfs/data"]
  spark-job: &spark-job
    build:
      context: ..
      dockerfile: ci/Dockerfile.spark
    profiles: ["jobs"]
    user: "0:0"
    environment:
      HADOOP_USER_NAME: root
      CHICAGO_HDFS_URI: hdfs://namenode:9000
      CHICAGO_COMMIT: ${GITHUB_SHA:-local}
      CHICAGO_RUN_ID: ${CHICAGO_RUN_ID:-manual}
      CHICAGO_ARTIFACT_DIR: ${CHICAGO_ARTIFACT_DIR:-artifacts}
      CHICAGO_SIMULATION_DATE: ${CHICAGO_SIMULATION_DATE:-}
      CHICAGO_BATCH_ID: ${CHICAGO_BATCH_ID:-}
      CHICAGO_FAIL_AFTER_PROMOTE: ${CHICAGO_FAIL_AFTER_PROMOTE:-0}
      CHICAGO_NORMALIZE_ONCE: ${CHICAGO_NORMALIZE_ONCE:-0}
      PYTHONIOENCODING: utf-8
      PYTHONPATH: /opt/project
    volumes: ["..:/opt/project"]
    entrypoint: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g"]
    mem_limit: 3g
  spark-kafka:
    <<: *spark-job
    profiles: ["kafka-jobs"]
    build:
      context: ..
      dockerfile: ci/Dockerfile.spark-kafka

volumes:
  namenode:
  datanode1:
  datanode2:
  datanode3:
